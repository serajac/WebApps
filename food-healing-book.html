  .day-cell {

  .journal-area {
    width: 100%; min-height: 80px; padding: 12px;
    background: var(--bg-journal); border: 1px solid var(--border-input);
    border-radius: 10px; color: var(--color-journal); font-family: 'Lora', serif;
    font-size: 14px; resize: vertical; outline: none; line-height: 1.7;
    transition: border 0.2s, background 0.3s;
  }
  .journal-area:focus { border-color: #4a9e48; }
  .journal-area::placeholder { color: var(--color-muted); opacity: 0.7; }

  .quiz-option {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
    border-radius: 8px; cursor: pointer; border: 1px solid var(--border-quiz);
    margin-bottom: 6px; transition: all 0.2s; background: var(--bg-quiz);
  }
  .quiz-option:hover { background: var(--bg-quiz-hover); border-color: var(--border-gold); }
  .quiz-option.correct { background: rgba(74,158,72,0.12); border-color: #4a9e48; }
  .quiz-option.wrong   { background: rgba(220,80,80,0.08); border-color: rgba(220,80,80,0.4); }
  .quiz-radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-muted); flex-shrink: 0; margin-top: 2px; transition: all 0.2s; }
  .quiz-radio.correct { border-color: #4a9e48; background: #4a9e48; }
  .quiz-radio.wrong   { border-color: #dc5050; background: #dc5050; }

    padding: 10px 14px; border-radius: 8px; margin-top: 8px;

    display: flex; gap: 10px; padding: 10px;

    background: var(--bg-bloom); align-items: flex-start;

    flex-shrink: 0; padding: 2px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 500; background: rgba(180,140,60,0.15);

    position: relative;

    background: linear-gradient(135deg, rgba(220,140,60,0.18), rgba(220,80,80,0.1));

  .notif-off { background: rgba(220,140,60,0.15); color: #8a6a20; }

// SVG fallback shown if network fails - meal-specific gradient + icon
function svgFallback(meal) {
  const config = {
    breakfast: { icon: '🌅', gradient: ['#f5d68a', '#e89a3c', '#c87020'], label: 'BREAKFAST' },
    lunch:     { icon: '☀️', gradient: ['#a8d878', '#5a9938', '#3a7022'], label: 'LUNCH' },
    dinner:    { icon: '🌙', gradient: ['#8a4a78', '#5a2a58', '#2a1a38'], label: 'DINNER' }
  };
  const c = config[meal] || config.breakfast;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 400' preserveAspectRatio='xMidYMid slice'>
    <defs><linearGradient id='g${meal}' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='${c.gradient[0]}'/>
      <stop offset='50%' stop-color='${c.gradient[1]}'/>
      <stop offset='100%' stop-color='${c.gradient[2]}'/>
    </linearGradient></defs>
    <rect width='800' height='400' fill='url(#g${meal})'/>
    <circle cx='620' cy='100' r='80' fill='rgba(255,255,255,0.15)'/>
    <circle cx='150' cy='320' r='60' fill='rgba(255,255,255,0.1)'/>
    <text x='400' y='200' font-size='90' text-anchor='middle' dominant-baseline='central'>${c.icon}</text>
    <text x='400' y='290' font-size='18' fill='white' opacity='0.85' text-anchor='middle' letter-spacing='6' font-family='sans-serif' font-weight='600'>${c.label}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const getUnsplashUrl = (meal) => {
  const pool = IMAGE_POOLS[meal] || IMAGE_POOLS.breakfast;
  // Pick semi-randomly but consistent per call
  return pool[Math.floor(Math.random() * pool.length)];
};

// Filter recipes that match user's conditions; fallback to all if no match
function pickRecipe(meal, profile, exclude = []) {
  const all = RECIPE_DB[meal] || [];
  if (all.length === 0) return null;
  const userConds = (profile.conditions || []).map(c => c.toLowerCase());
  // Map UI condition labels to tags
  const condToTag = {
    "type 2 diabetes":"diabetes","high blood pressure":"heart","high cholesterol":"cholesterol",
    "obesity":"weight","arthritis":"arthritis","psoriatic arthritis":"psoriatic","rheumatoid arthritis":"rheumatoid","psoriasis":"psoriatic","chronic pain":"pain","autoimmune":"autoimmune","ibs / gut issues":"gut","fatty liver":"weight",
    "heart disease":"heart","chronic fatigue":"fatigue","inflammation":"inflammation",
    "thyroid issues":"hormones","anxiety / depression":"fatigue","hormonal imbalance":"hormones","none":""
  };
  const userTags = userConds.map(c => condToTag[c] || c).filter(Boolean);
  
  // Score each recipe by how many user tags it matches
  let candidates = all.filter(r => !exclude.includes(r.name));
  if (candidates.length === 0) candidates = all;
  
  const scored = candidates.map(r => {
    const score = (r.tags || []).filter(t => userTags.includes(t)).length;
    return { recipe: r, score };
  });
  
  // Sort: best matches first; pick from top tier with randomness for variety
  scored.sort((a,b) => b.score - a.score);
  const topScore = scored[0]?.score || 0;
  const topTier = scored.filter(s => s.score >= Math.max(0, topScore - 1));
  const choice = topTier[Math.floor(Math.random() * topTier.length)];
  return choice ? choice.recipe : candidates[0];
}

// ─── SIMULATED API CALLS (no network needed) ──────────────────────────────────
function simDelay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function generateRecipe(meal, profile, dayIndex = 0) {
  await simDelay(700 + Math.random() * 800); // realistic loading feel
  const rec = pickRecipe(meal, profile);
  if (!rec) throw new Error('No recipe found for this meal');
  return rec;
}

async function generateWeekPlan(profile) {
  await simDelay(1500);
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const week = [];
  const usedB = [], usedL = [], usedD = [];
  for (let i = 0; i < 7; i++) {
    const b = pickRecipe('breakfast', profile, usedB);
    const l = pickRecipe('lunch', profile, usedL);
    const d = pickRecipe('dinner', profile, usedD);
    usedB.push(b.name); usedL.push(l.name); usedD.push(d.name);
    // Recycle once we've used all 5
    if (usedB.length >= RECIPE_DB.breakfast.length) usedB.length = 0;
    if (usedL.length >= RECIPE_DB.lunch.length) usedL.length = 0;
    if (usedD.length >= RECIPE_DB.dinner.length) usedD.length = 0;
    week.push({
      day: days[i],
      breakfast: { name: b.name, tagline: b.tagline, calories: b.calories },
      lunch:     { name: l.name, tagline: l.tagline, calories: l.calories },
      dinner:    { name: d.name, tagline: d.tagline, calories: d.calories }
    });
  }
  return week;
}

// ─── BMI UTILITY ──────────────────────────────────────────────────────────────
function calcBMI(weightLbs, heightIn) {
  if (!weightLbs || !heightIn) return null;
  const bmi = (weightLbs / (heightIn * heightIn)) * 703;
  let cat, color, pct;
  if (bmi < 18.5) { cat = 'Underweight'; color = '#5b9bd5'; pct = 20; }
  else if (bmi < 25) { cat = 'Healthy Weight'; color = '#4a9e48'; pct = 42; }
  else if (bmi < 30) { cat = 'Overweight'; color = '#e0a020'; pct = 65; }
  else { cat = 'Obese'; color = '#dc5050'; pct = 85; }
  return { value: bmi.toFixed(1), cat, color, pct };
}

                title: "3. Blood Sugar Architecture",
                icon: "📊",
                content: "Every meal is an architectural decision about your blood glucose. The construction material you choose (complex carbs vs. simple sugars) determines whether your body builds a stable mansion or a crumbling shack.",
                science: "Postprandial glucose spikes trigger rapid insulin secretion. Over years, this leads to insulin resistance — where cells stop responding to insulin's key, leaving glucose circulating in blood. Foods with low glycemic load (GL) cause gentle, sustained glucose curves rather than spikes.",
                analogy: "Eating white bread is like throwing newspaper on a fire — it burns fast and hot, then dies. Eating lentils is like adding a hardwood log — it burns steady and warm for hours. Your energy follows the same pattern.",
                foods: "🟢 Heal: Lentils (GI 32), quinoa (GI 53), sweet potato (GI 44), berries (GI 25-40) ❌ Harm: White bread (GI 75), sugary drinks (GI 63-72), white rice (GI 72), candy"
              },
              {
                title: "4. Epigenetics: Food Talks to Your DNA",
                icon: "🧬",
                content: "You are not a prisoner of your genetics. Specific nutrients act as epigenetic modulators — they literally turn healing genes ON and disease genes OFF. This is the frontier of precision nutrition.",
                science: "Sulforaphane (broccoli sprouts) activates Nrf2, the master antioxidant gene. Resveratrol (grapes, blueberries) activates SIRT1, the longevity gene. Folate (leafy greens) regulates methylation patterns that control cancer suppressor genes. These aren't supplements — they're food signals.",
                analogy: "Think of your DNA as a piano with 20,000 keys. Most keys are silent by default. Food compounds are like a pianist's hands — choosing which keys to press and when, creating the music of health or disease.",
                foods: "🟢 Broccoli sprouts (sulforaphane), blueberries (resveratrol), turmeric (curcumin), green tea (EGCG), garlic (allicin), flaxseed (lignans)"
              }
            ].map((section, i) => (
              <div key={i} className="card" style={{ marginBottom:14 }}>
                <div style={{ display:'flex', gap:10, alignItems:'flex-start', marginBottom:12 }}>
                  <span style={{ fontSize:28 }}>{section.icon}</span>
                  <div>
                    <div style={{ fontFamily:'Playfair Display, serif', fontSize:18, color:'var(--color-title)' }}>{section.title}</div>
                    <p style={{ fontSize:13, color:'var(--color-sub)', marginTop:4, lineHeight:1.7 }}>{section.content}</p>
                  </div>
                </div>
                <div className="science-box"><div className="info-block"><h4>🔬 Mechanism</h4><p style={{ fontSize:13 }}>{section.science}</p></div></div>
                <div className="analogy-box"><div className="info-block"><h4>💡 Analogy</h4><p style={{ fontSize:13 }}>"{section.analogy}"</p></div></div>
                <div style={{ fontSize:12, color:'var(--color-sub)', background:'var(--bg-row)', borderRadius:8, padding:'8px 12px' }}>
                  {section.foods}
                </div>
              </div>
            ))}

            <div className="card card-gold">
              <div style={{ fontFamily:'Playfair Display, serif', fontSize:17, color:'var(--color-title)', marginBottom:12 }}>📚 Knowles' 6 Andragogy Principles Applied</div>
              {[
                ["1. Self-Concept","You are the expert on your body. This book guides, not prescribes."],
                ["2. Prior Experience","Your cultural food traditions are honored and reimagined, not discarded."],
                ["3. Readiness to Learn","Each recipe addresses YOUR specific health challenge — immediate relevance."],
                ["4. Orientation","Food healing knowledge is applied TODAY — not theory for someday."],
                ["5. Motivation","Internal: feeling better, reversing disease — not external grades."],
                ["6. Need to Know","Every ingredient includes its 'why' — no mystery ingredients."]
              ].map(([p,d])=>(
                <div key={p} style={{ display:'flex', gap:10, marginBottom:8 }}>
                  <span style={{ color:'#8a6a20', fontSize:12, fontWeight:700, flexShrink:0, minWidth:100 }}>{p}</span>
                  <span style={{ fontSize:13, color:'var(--color-body)' }}>{d}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── TAB 7: ASSESSMENT ── */}
        {activeTab === 7 && (
          <div className="grow-in">
            <div className="section-title">Knowledge Assessment</div>
            <div className="section-subtitle">7 Clinical-Level Questions · Bloom's Levels 2–5</div>

            {quizSubmitted && (
              <div className={`card ${quizScore >= 5 ? 'card-green' : 'card-gold'}`} style={{ textAlign:'center', marginBottom:20 }}>
                <div style={{ fontSize:40, marginBottom:8 }}>{quizScore >= 6 ? '🌟' : quizScore >= 4 ? '🌿' : '💪'}</div>
                <div style={{ fontFamily:'Playfair Display, serif', fontSize:24, color:'var(--color-title)' }}>{quizScore}/{assessmentQuestions.length} Correct</div>
                <div style={{ fontSize:13, color:'var(--color-sub)', marginTop:6 }}>
                  {quizScore >= 6 ? 'Excellent! You have a strong grasp of healing nutrition science.' :
                   quizScore >= 4 ? 'Good foundation! Review the Learning tab to reinforce the concepts you missed.' :
                   'Keep learning! Re-read the Science sections, then retake this assessment.'}
                </div>
                <button className="btn btn-outline btn-sm" style={{ marginTop:12 }} onClick={()=>{ setQuizAnswers({}); setQuizSubmitted(false); }}>
                  🔄 Retake Assessment
                </button>
              </div>
            )}

            {assessmentQuestions.map((q, qi) => (
              <div key={qi} className="card" style={{ marginBottom:14 }}>
                <div style={{ fontFamily:'Lora, serif', fontSize:15, color:'var(--color-title)', marginBottom:12, lineHeight:1.6 }}>
                  <span style={{ color:'#8a6a20', marginRight:8 }}>Q{qi+1}.</span>{q.q}
                </div>
                {q.options.map((opt, oi) => {
                  const selected = quizAnswers[qi] === oi;
                  const isCorrect = oi === q.correct;
                  let cls = 'quiz-option';
                  if (quizSubmitted && selected && isCorrect) cls += ' correct';
                  else if (quizSubmitted && selected && !isCorrect) cls += ' wrong';
                  else if (quizSubmitted && isCorrect) cls += ' correct';
                  return (
                    <div key={oi} className={cls} onClick={()=>!quizSubmitted && setQuizAnswers(a=>({...a,[qi]:oi}))}>
                      <div className={`quiz-radio ${quizSubmitted&&isCorrect?'correct':''} ${quizSubmitted&&selected&&!isCorrect?'wrong':''}`}/>
                      <span style={{ fontSize:13, color:'var(--color-body)', lineHeight:1.6 }}>{opt}</span>
                    </div>
                  );
                })}
                {quizSubmitted && (
                  <div className="rationale-box">
                    <strong style={{ color:'#4a9e48' }}>💡 Rationale: </strong>{q.rationale}
                  </div>
                )}
              </div>
            ))}

            {!quizSubmitted && (
              <button className="btn btn-primary" style={{ width:'100%', justifyContent:'center', padding:16 }}
                onClick={()=>setQuizSubmitted(true)}
                disabled={Object.keys(quizAnswers).length < assessmentQuestions.length}>
                ✅ Submit Assessment ({Object.keys(quizAnswers).length}/{assessmentQuestions.length} answered)
              </button>
            )}
          </div>
        )}

      </div>

      <div style={{ padding:'20px 24px', textAlign:'center', borderTop:'1px solid var(--border-card)', marginTop:16 }}>
        <div style={{ fontSize:11, color:'var(--color-muted)', letterSpacing:2, textTransform:'uppercase' }}>
          Food Healing Book · Built on Malcolm Knowles' Andragogy · Powered by AI
        </div>
        <div style={{ fontSize:11, color:'var(--color-muted)', marginTop:4, opacity:0.7 }}>
          Content is educational. Consult your physician before making major dietary changes for medical conditions.
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FoodHealingBook />);

setTimeout(() => {
  const splash = document.getElementById('loadingSplash');
  if (splash) {
    splash.classList.add('hidden');
    setTimeout(() => splash.remove(), 500);
  }
}, 600);
</script>

</body>
</html>
