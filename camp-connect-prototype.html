<style>
/* Layout: native-feeling app shell. Phone: compact nav bar + 49pt tab bar (Apple HIG, Material 3);
   tablet: icon rail; desktop: nav, content, "up next" panel.
   System fonts (SF Pro on iPhone, Roboto on Android). Text in rem so iOS Dynamic Type and Android font scaling apply.
   Brand: CAMP greens; red is reserved for safety. */
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --surface-alt:#EEF3EA; --line:#DAE3D5; --ink:#2F2F2F; --muted:#5A675C;
  --green:#1F7F36; --green-deep:#00703A; --lime:#C8D729; --on-accent:#FFFFFF; --green-soft:#E3F1E5;
  --red:#C62828; --red-soft:#FDECEA; --on-red:#FFFFFF; --amber:#7A5300; --amber-soft:#FFF3D1;
  --bar-bg:rgba(255,255,255,.86); --scrim:rgba(10,16,12,.45);
  --shadow:0 1px 2px rgba(20,40,25,.06),0 4px 14px rgba(20,40,25,.06);
  --gradient:linear-gradient(90deg,#009444,#2C9942,#60B635,#94C72D,#B8D428,#D7DF23);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --r:12px; --tap:44px; --tabbar-h:49px; --header-h:66px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1611; --surface:#17211A; --surface-alt:#1D2A21; --line:#2C3B30; --ink:#E8EEE6; --muted:#A2B1A4;
  --green:#5CBF72; --green-deep:#7DD08F; --lime:#C8D729; --on-accent:#0C1A10; --green-soft:#1F3525;
  --red:#F07A7A; --red-soft:#3A1C1C; --on-red:#1E0A0A; --amber:#F2C866; --amber-soft:#3A2F14;
  --bar-bg:rgba(23,33,26,.86); --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1611; --surface:#17211A; --surface-alt:#1D2A21; --line:#2C3B30; --ink:#E8EEE6; --muted:#A2B1A4;
  --green:#5CBF72; --green-deep:#7DD08F; --lime:#C8D729; --on-accent:#0C1A10; --green-soft:#1F3525;
  --red:#F07A7A; --red-soft:#3A1C1C; --on-red:#1E0A0A; --amber:#F2C866; --amber-soft:#3A2F14;
  --bar-bg:rgba(23,33,26,.86); --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

/* iPhone and iPad: follow the user's Text Size setting (Dynamic Type). Body = 17pt by default. */
@supports (font:-apple-system-body) and (-webkit-touch-callout:none){html{font:-apple-system-body}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.47;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
html.noscroll,html.noscroll body{overflow:hidden}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1rem)} /* 16px or larger stops iOS Safari from zooming on focus */
button,a,input,select,textarea,label,summary{touch-action:manipulation}
button,a{-webkit-tap-highlight-color:transparent}
nav button,.btn,.chip,.tools button,.amounts button,.icon-btn,.safety-btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
a{color:var(--green)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header (navigation bar) ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:4px;background:var(--gradient)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:42px;height:42px;display:grid;place-items:center;flex:none}
.mark img{width:100%;height:100%;object-fit:contain}
.logo-full{width:min(230px,62%);height:auto;display:block;margin:4px auto 0}
.hero-guest{display:grid;gap:14px;justify-items:center;text-align:center}
.hero-guest .lede{margin-inline:auto}
.brand b{font-weight:700;font-size:1.0625rem;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:.6875rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.search{flex:1;min-width:0;position:relative;max-width:520px;margin-left:auto}
.search input{width:100%;min-height:var(--tap);padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface-alt);-webkit-appearance:none;appearance:none}
.search > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;z-index:60}

}

/* ---------- components ---------- */

/* today cards */

/* touch feedback (HIG: every tap gets a visible response) */
.btn:active,.chip:active,.tools button:active,.amounts button:active,.icon-btn:active,.safety-btn:active,nav.side button:active,nav.bottom button:active,.results button:active{transform:scale(.97);opacity:.8}
.btn,.chip,.tools button,.amounts button,.icon-btn,.safety-btn,nav button{transition:transform .12s ease,opacity .12s ease,background-color .15s ease}
/* hover only where a pointer can hover, so touch screens don't get stuck hover states */
@media (hover:hover){
  .btn:hover{border-color:var(--green)}
  .btn.primary:hover,.btn.danger:hover{filter:brightness(1.06)}
  nav.side button:hover{color:var(--ink)}
  .tools button:hover{background:var(--surface-alt);color:var(--ink)}
  .results button:hover{background:var(--green-soft)}
}
.results button:focus-visible{background:var(--green-soft)}
/* touch screens: every control at least 44 x 44 */
@media (pointer:coarse){
  .btn.sm,.chip{min-height:var(--tap)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.live{animation:pulse 1.6s infinite}
</style>

function filteredSections() {
  const f = S.filters, st = me();
  return SECTIONS.filter(s => (f.campus === "Any" || s.campus === f.campus) && (f.subject === "Any" || (f.subject === "My program" ? s.subject === st.program : s.subject === f.subject)) && (f.delivery === "Any" || s.delivery === f.delivery)
    && (f.time === "Any" || (f.time === "Morning" && toMin(s.start) < 720) || (f.time === "Afternoon" && toMin(s.start) >= 720 && toMin(s.start) < 1020) || (f.time === "Evening" && toMin(s.start) >= 1020) || (f.time === "Weekend" && s.days.includes("S")))
    && (!f.after5 || !s.start || toMin(s.start) >= 1020));
}
function conflictsFor(id) {
  const a = sec(id); if (!a.start) return [];
  return S.plan.filter(x => x !== id).map(sec).filter(b => b.start && [...a.days].some(d => b.days.includes(d)) && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end));
}

   <label class="switch" style="margin-top:12px"><input type="checkbox" id="after5" ${f.after5 ? "checked" : ""}> ${t("Only show classes after 5 PM")}</label>
   <p class="muted" style="font-size:0.875rem;margin:10px 0">${rows.length} sections</p>
   <div class="list">${rows.map(s => { const inPlan = S.plan.includes(s.id); return `<div class="item"><div><b>${esc(s.code)} ${esc(s.title)}</b> <span class="muted">${s.cr} credits</span>
     <div class="muted" style="font-size:0.875rem">${daysTxt(s.days)}${s.start ? ", " + fmtT(s.start) + "-" + fmtT(s.end) : ""}, ${esc(s.campus)}${s.room ? ", Rm " + esc(s.room) : ""}, ${esc(s.delivery)}, ${esc(s.instructor)}</div></div>
     <div class="row">${s.seats === 0 ? `<span class="pill bad">Full</span>` : `<span class="pill ${s.seats <= 3 ? "warn" : ""} num">${s.seats} seats left</span>`}
     <button class="btn sm ${inPlan ? "" : "primary"}" data-act="${inPlan ? "unplan" : "plan"}" data-id="${s.id}">${inPlan ? t("Remove") : t("Add")}</button></div></div>`; }).join("") || `<div class="muted">No classes match. Try "Any" for time or campus.</div>`}</div>
  </section>

  <section class="card"><div class="card-head"><h2>${t("My plan")}</h2><span class="pill num">${S.plan.length} classes, ${credits} credits</span></div>
   ${S.plan.length ? `${anyConflict ? `<div class="note bad" style="margin-bottom:12px"><b>Time conflict.</b> Two classes in your plan meet at the same time. Remove one or pick another section.</div>` : ""}
   ${anyFull ? `<div class="note warn" style="margin-bottom:12px"><b>Full section in your plan.</b> You can join the waitlist in the Student Information System, or choose an open section.</div>` : ""}
   ${weekGrid()}
   <div class="list" style="margin-top:12px">${S.plan.map(sec).map(s => `<div class="item"><div><b>${esc(s.code)}</b> ${esc(s.title)}<div class="muted" style="font-size:0.875rem">${daysTxt(s.days)}${s.start ? " " + fmtT(s.start) : ""}, ${esc(s.campus)}</div></div>${conflictsFor(s.id).length ? `<span class="pill bad">Conflicts with ${esc(conflictsFor(s.id)[0].code)}</span>` : s.seats === 0 ? `<span class="pill bad">Full</span>` : `<span class="pill ok">OK</span>`}</div>`).join("")}</div>
   <button class="btn primary block" style="margin-top:14px" data-act="enroll" ${anyConflict ? "disabled" : ""}>${t("Enroll in my plan")}</button>
   ${anyConflict ? `<p class="muted" style="font-size:0.875rem;margin:8px 0 0">Fix the conflict to continue.</p>` : ""}`

  </section>

  <section class="card" id="pay-card"><div class="card-head"><h2>Balance & payment, Fall 2026</h2>${st.balance > 0 ? `<span class="pill warn">Due ${esc(st.dueDate)}</span>` : `<span class="pill ok">Paid</span>`}</div>
   <div class="table-wrap"><table><tbody>
   <tr><td>Tuition and fees</td><td class="num" style="text-align:right">${money(st.balance + st.aid)}</td></tr>
   <tr><td>Financial aid applied</td><td class="num" style="text-align:right">-${money(st.aid)}</td></tr>
   <tr><td><b>Amount due</b></td><td class="num" style="text-align:right"><b>${money(st.balance)}</b></td></tr></tbody></table></div>
   <div class="grid3" style="margin-top:14px"><button class="btn primary" data-act="handoff" data-to="pay">${t("Pay now")}</button><button class="btn" data-act="handoff" data-to="plan">${t("Set up a payment plan")}</button><button class="btn" data-act="toHelp">${t("Check financial aid")}</button></div>
   <p class="muted" style="font-size:0.8438rem;margin:12px 0 0">Payments are made on the College's official payment page. CAMP Connect never asks for card numbers. Reminders go out 7 days, 2 days, and the morning of the deadline.</p>
  </section>`;
}
function weekGrid() {
  const H0 = 8 * 60, H1 = 22 * 60, H = 420, ppm = H / (H1 - H0);
  const days = ["M", "T", "W", "R", "F", "S"];
  const current = me().schedule.map(sec);
  const block = (s, cls) => { const top = (toMin(s.start) - H0) * ppm, h = (toMin(s.end) - toMin(s.start)) * ppm; return `<div class="blk ${cls}" style="top:${top}px;height:${Math.max(h, 22)}px">${esc(s.code)}<small>${fmtT(s.start)}</small></div>`; };
  const hours = []; for (let h = 8; h <= 22; h += 2) hours.push(`<span style="top:${(h * 60 - H0) * ppm}px">${h > 12 ? h - 12 : h}${h >= 12 ? "p" : "a"}</span>`);
  const online = S.plan.map(sec).filter(s => !s.start);
  return `<div class="table-wrap" style="border:0"><div class="week" role="img" aria-label="Weekly view of your Spring plan">
    <div class="hcell"></div>${days.map(d => `<div class="hcell">${DAYMAP[d]}</div>`).join("")}
    <div class="hours">${hours.join("")}</div>
    ${days.map(d => `<div class="daycol">${S.plan.map(sec).filter(s => s.start && s.days.includes(d)).map(s => block(s, conflictsFor(s.id).length ? "conflict" : "plan")).join("")}</div>`).join("")}
  </div></div>${online.length ? `<p class="muted" style="font-size:0.875rem;margin:8px 0 0">Online, any time: ${online.map(s => esc(s.code)).join(", ")}</p>` : ""}`;
}

/* ================= SAFETY ================= */
function totals() { const A = S.alert; if (!A) return {}; let inn = 0, safe = 0, help = 0; A.rows.forEach(r => { inn += r.inn; safe += r.safe; help += r.help; }); return { inn, safe, help, none: inn - safe - help }; }
function dashboardCard() {
  const A = S.alert, T = totals(), pct = T.inn ? Math.round(T.safe / T.inn * 100) : 0;
  return `<section class="card" style="border-color:var(--red)"><div class="card-head"><h2>Accountability, ${esc(A.type)}${A.drill ? " (drill)" : ""}</h2><span class="pill num">${elapsed()}</span></div>
  <p class="muted" style="margin:0 0 10px">Sent to ${esc(A.targetLabel)} by push, text, email, and Teams (simulated).</p>
  <div class="grid3" style="margin-bottom:6px">${[["Checked in", T.inn, ""], ["Safe", T.safe, "ok"], ["Need help", T.help, "bad"], ["No response", T.none, "warn"]].map(([a, b, c]) => `<div class="stat"><span class="kicker">${a}</span><b class="num" style="${c === "bad" && b ? "color:var(--red)" : c === "ok" ? "color:var(--green)" : ""}">${b}</b></div>`).join("")}</div>
  <div class="bar solid" aria-label="${pct}% safe"><i style="width:${pct}%"></i></div><p class="num muted" style="font-size:0.875rem;margin:6px 0 10px">${pct}% confirmed safe</p>
  <div class="table-wrap" style="border:0"><div style="min-width:440px"><div class="dash-row h"><span>Building</span><span>In</span><span>Safe</span><span>Help</span><span>None</span></div>
  ${A.rows.map(r => `<div class="dash-row"><span><b>${esc(r.name)}</b><br><span class="muted" style="font-size:0.8125rem">${esc(r.campus)}</span></span><span class="num">${r.inn}</span><span class="num" style="color:var(--green)">${r.safe}</span><span class="num" style="${r.help ? "color:var(--red);font-weight:800" : ""}">${r.help}</span><span class="num">${r.inn - r.safe - r.help}</span></div>`).join("")}</div></div>
  ${A.helpList.length ? `<div class="note bad" style="margin-top:12px"><b>Help requests:</b> ${A.helpList.map(esc).join("; ")}</div>` : ""}
  ${role() === "admin" ? `<div class="row" style="margin-top:14px"><button class="btn primary" data-act="allclear">Send all-clear</button></div>` : ""}</section>`;
}
function rosterCard() {
  const A = S.alert; if (!A) return "";
  return `<section class="card" style="border-color:var(--red)"><div class="card-head"><h2>My class during this alert, EMS 111</h2><span class="pill bad">${esc(A.type)}</span></div>
   <div class="grid3">${ROSTER.map((n, i) => { const st = A.roster[i]; return `<div class="item" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${n}</span><span class="pill ${st === "Safe" ? "ok" : st === "Need help" ? "bad" : "warn"}">${st}</span></div>`; }).join("")}</div></section>`;
}
function elapsed() { const s = Math.floor((Date.now() - S.alert.at) / 1000); return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`; }
function safetyView() {
  const r = role();
  const call = `<div class="grid2"><div class="card" style="border-color:var(--red)"><div class="kicker">Emergency</div><div class="answer" style="color:var(--red)">${t("Call 911")}</div><p class="muted" style="margin:4px 0 12px">Police, fire, and medical. Tell them which campus and building.</p><a class="btn danger block" href="tel:911">${t("Call 911")}</a></div>

  const checkin = r === "guest" ? `<section class="card"><h2>Visitor check-in</h2><p class="muted">Get safety alerts while you're on campus. Your check-in ends automatically tonight.</p><button class="btn primary" data-act="visitor">Check in as a visitor</button></section>` : `<section class="card"><div class="card-head"><h2>${t("Building check-in")}</h2>${S.checkedIn ? `<span class="pill ok dot">Checked in</span>` : `<span class="pill">Not checked in</span>`}</div>

      : `<div class="filters" style="margin-top:12px"><div class="field"><label for="bpick">Pick your building</label><select id="bpick">${BUILDINGS.map(b => `<option value="${b.id}">${esc(b.name)} - ${esc(b.campus)}</option>`).join("")}</select></div></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="checkin">${t("Check in")}</button><button class="btn" data-act="geo">Check in by location</button><button class="btn" data-act="qr">Scan entrance QR</button></div>`}
  </section>`;
  const report = `<section class="card"><h2>${t("Report a concern")}</h2><form id="concern" class="stack" style="margin-top:10px">
    <div class="field"><label for="cwhere">Where</label><select id="cwhere">${BUILDINGS.map(b => `<option>${esc(b.name)} - ${esc(b.campus)}</option>`).join("")}<option>Parking lot</option><option>Off campus / online</option></select></div>
    <div class="field"><label for="cwhat">What's happening</label><textarea id="cwhat" placeholder="Describe what you saw or heard" required></textarea></div>
    <div class="field"><label for="cphoto">Photo (optional)</label><input id="cphoto" type="file" accept="image/*"></div>
    <label class="switch"><input type="checkbox" id="anon"> Send anonymously</label>
    <button class="btn primary">Send to Security</button></form></section>`;
  const timer = `<section class="card"><h2>${t("Safety timer")}</h2><p class="muted" style="margin:4px 0 12px">Walking to your car after class? If you don't cancel in time, your contact and Security are notified.</p>
    ${S.timer ? `<div class="timer num" id="tleft">${fmtLeft()}</div><div class="countdown-bar"><i id="tbar" style="width:${S.timer.left / S.timer.total * 100}%"></i></div><p class="muted" style="font-size:0.875rem">Contact: ${esc(S.timer.contact)}</p><button class="btn primary" data-act="tcancel">I made it - cancel</button>`
      : `<div class="filters"><div class="field"><label for="tmin">Minutes</label><select id="tmin"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div><div class="field"><label for="tcon">Contact</label><select id="tcon"><option>CAMP Security</option><option>Emergency contact (sample)</option></select></div></div><button class="btn" style="margin-top:12px" data-act="tstart">Start timer</button>`}</section>`;
  const inbox = `<section class="card"><h2>${t("Alert inbox")}</h2><div class="list" style="margin-top:10px">${S.inbox.map(a => `<div class="item"><div><b>${esc(a.t)}</b><div class="muted" style="font-size:0.875rem">${esc(a.d)}</div></div>${a.drill ? `<span class="pill">Drill</span>` : ""}</div>`).join("")}</div></section>`;
  const consoleCard = (r === "admin") ? `<section class="card" style="border-color:var(--red)"><div class="card-head"><h2>${t("Alert console")}</h2><span class="pill bad">Admin</span></div>
    ${S.alert ? `<div class="note bad">An alert is active. Send an all-clear before starting another.</div>` : `<form id="alertform" class="stack">
    <div class="filters"><div class="field"><label for="atype">Template</label><select id="atype">${Object.keys(TEMPLATES).map(k => `<option>${k}</option>`).join("")}</select></div>
    <div class="field"><label for="atarget">Send to</label><select id="atarget"><option value="all">All campuses</option>${Object.keys(CAMPUSES).map(c => `<option value="c:${c}">${c} campus</option>`).join("")}${BUILDINGS.map(b => `<option value="b:${b.id}">${esc(b.name)} - ${esc(b.campus)}</option>`).join("")}</select></div></div>
    <div class="field"><label for="amsg">Message</label><textarea id="amsg">${TEMPLATES.Lockdown}</textarea></div>

    <button class="btn danger">${t("Send alert")}</button></form>`}</section>` : "";
  return `<div class="page-head"><div><h1>${t("Safety")}</h1><p class="lede">Help in one tap. Check in so you're counted in an emergency.</p></div></div>
  ${alertCard()}${r === "admin" ? consoleCard : ""}${S.alert && (r === "admin" || r === "dean") ? dashboardCard() : ""}${S.alert && r === "faculty" ? rosterCard() : ""}

    return { v: "hold", care: true, reason: "Student may need support", title: "You're not alone", msg: "We didn't publish this post, and a counselor has been asked to reach out. You can talk to CAMP Counseling at 757-555-0170 (sample number). If you're in crisis, call or text 988 any time, day or night." };
  if (/\b\d{3}-\d{2}-\d{4}\b/.test(t) || /(\(?\b\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}\b)/.test(t) || /[\w.+-]+@[\w-]+\.[\w.]+/.test(t) || /\b\d{2,5}\s+[a-z]+(\s[a-z]+)?\s+(st|street|ave|avenue|rd|road|dr|drive|ln|lane|blvd|ct|court|way)\b/i.test(t) || /\b(student )?id\s*(number|#|no\.?)?\s*:?\s*\d{4}\s?\d{4}\b/i.test(t))
    return { v: "block", title: "Remove personal information", msg: "Posts can't include phone numbers, email addresses, home addresses, or ID numbers, yours or anyone else's. Remove them and share contact details privately." };
  if (/\b(you'?re|you are|he'?s|she'?s|they'?re|is an?|what an?)\s+(an?\s+)?(idiot|stupid|loser|ugly|dumb|worthless|pathetic|trash)\b|\b(shut up|nobody likes you|hate you|kill yourself|kys)\b/i.test(t))
    return { v: "hold", reason: "May be disrespectful toward a person", title: "Sent for review", msg: "This post was sent to a moderator because it may be disrespectful toward someone. It will appear if it's approved. Campus Feed is for building each other up." };
  if (/\b(exam|test|quiz|midterm|final|homework|lab)\s+(answers?|key)\b|\btest ?bank\b|\banswer key\b|\bdo my (homework|assignment|essay|paper|lab)\b|\bpay (someone|you|me) to\b|\bwrite my (essay|paper)\b/i.test(t))
    return { v: "hold", reason: "Possible academic dishonesty", title: "Sent to your instructor's review", msg: "This post may share or ask for graded work, so a faculty member will review it first. Study groups and general questions are welcome." };
  const links = t.match(/\b((https?:\/\/)?(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|net|org|io|ly|co|me|gg|info|biz|xyz|app|edu|gov)(\/[^\s]*)?)/gi) || [];
  if (links.some(l => !/\.(edu|gov)(\/|$)/i.test(l.replace(/^https?:\/\//, "").split("/")[0] + "/")))
    return { v: "hold", reason: "Link outside CAMP", title: "Sent for review", msg: "Links to sites outside .edu and .gov are checked by a moderator before the post appears. This keeps scams and ads off Campus Feed." };
  const letters = t.replace(/[^a-z]/gi, "");
  if (letters.length > 20 && letters.replace(/[^A-Z]/g, "").length / letters.length > .7) return { v: "block", title: "Please use regular capitalization", msg: "Posts written in all capital letters read as shouting. Rewrite it in regular case and post again." };
  if (opts.photo && !opts.consent) return { v: "block", title: "Confirm the photo", msg: "Check the box to confirm that everyone in the photo agreed to have it posted." };
  if (opts.recent >= 5) return { v: "block", title: "Take a short break", msg: "You can post up to 5 times an hour. Try again a little later." };
  if (opts.photo && opts.role === "Student") return { v: "hold", reason: "Photo check", title: "Sent for review", msg: "Photos from students are checked by a moderator before they appear, usually within a few hours on weekdays." };
  return { v: "ok" };
}

/* ---------- views ---------- */
function feedView() {
  const r = role(), meF = feedMe(), q = queue();
  const tabs = [["feed", "Feed"], ...(meF ? [["mine", "My posts"]] : []), ...(canModerate() ? [["queue", `Review queue (${q.length})`]] : [])];
  if (!tabs.some(x => x[0] === S.feedTab)) S.feedTab = "feed";
  let body = "";
  if (S.feedTab === "queue") body = queueView(q);
  else {
    let list = POSTS.filter(p => !S.hiddenForMe[p.id]);
    if (S.feedTab === "mine") list = list.filter(p => meF && p.by === meF.by);
    else list = list.filter(p => p.status === "live" && (r !== "guest" || p.share) && (S.feedCh === "All" || p.ch === S.feedCh));
    list.sort((a, b) => (S.feedTab === "feed" ? (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) : 0) || b.at - a.at);
    body = `${S.feedTab === "feed" ? `<div class="chips" role="group" aria-label="Channels">${["All", ...FEED_CHANNELS].map(c => `<button class="chip" data-feed="ch" data-v="${c}" aria-pressed="${S.feedCh === c}">${c === "All" ? "All" : "#" + c}</button>`).join("")}</div>` : ""}
      <div class="stack">${list.map(postCard).join("") || `<div class="card muted">${S.feedTab === "mine" ? "You haven't posted yet. Share a win or start a study group." : "No posts in this channel yet."}</div>`}</div>`;
  }
  return `<div class="page-head"><div><div class="eyebrow">CAMP Connect</div><h1>Campus Feed</h1><p class="lede">Wins, study groups, and news from CAMP students, faculty, and staff.</p></div>
    <button class="btn sm" data-feed="rules">Community guidelines</button></div>
    ${r === "guest" ? `<div class="note">You're seeing posts the CAMP community chose to share publicly. Students and employees sign in to post and comment.</div>` : composer(meF)}
    ${tabs.length > 1 ? `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.feedTab === k}" data-feed="tab" data-v="${k}">${l}</button>`).join("")}</div>` : ""}
    ${body}`;
}

    <div class="fc-row"><span class="avatar ${meF.role === "Official" ? "official" : ""}" aria-hidden="true">${esc(meF.init)}</span>
      <div class="field" style="flex:1;min-width:0"><label for="fText" class="sr">Write a post</label>
      <textarea id="fText" maxlength="500" placeholder="Share a win, ask a question, or post something helpful for classmates">${esc(S.feedDraft)}</textarea></div></div>
    <div class="fc-opts">
      <div class="field"><label for="fCh">Channel</label><select id="fCh">${FEED_CHANNELS.map(c => `<option value="${c}" ${S.feedCh2 === c ? "selected" : ""}>#${c}</option>`).join("")}</select></div>
      <div class="field"><span style="font-weight:600;font-size:.875rem">Who can see it</span>
        <div class="seg" role="group" aria-label="Who can see it"><button type="button" data-feed="vis" data-v="camp" aria-pressed="${S.feedVis === "camp"}">${FIC.lock} CAMP only</button><button type="button" data-feed="vis" data-v="share" aria-pressed="${S.feedVis === "share"}">${FIC.globe} Shareable</button></div></div>
    </div>

    ${S.feedPhoto ? `<div class="photo-prev"><img src="${S.feedPhoto}" alt="Selected photo preview"><label class="switch"><input type="checkbox" id="fConsent"> Everyone in this photo agreed to have it posted</label><button type="button" class="btn sm" data-feed="unphoto">Remove photo</button></div>` : ""}
    <div class="row"><button type="button" class="btn sm" data-feed="photo">${FIC.photo}<span>Add photo</span></button><input id="fPhoto" class="sr" tabindex="-1" type="file" accept="image/*" aria-label="Choose a photo">
      <span id="fCount" class="muted small num" aria-live="polite">${n}/500</span><span style="flex:1"></span><button class="btn primary">Post</button></div>
    <p class="muted small" style="margin:0">Posts are checked for respectful language, personal information, safety, and academic honesty. <button type="button" class="linkbtn" data-feed="rules">Read the guidelines</button></p>

function postCard(p) {
  const mine = feedMe() && p.by === feedMe().by;

    : p.status === "removed" ? `<div class="note bad small"><b>Removed by a moderator.</b> ${esc(p.removeReason || "It didn't follow the community guidelines")}. Only you can see this notice.</div>` : "";
  const open = S.openCmts[p.id];
  const official = p.role === "Official";
  const canAct = p.status === "live" && role() !== "guest";
  return `<article class="card post" id="post-${p.id}" aria-label="Post by ${esc(p.by)}">
    <header class="post-h"><span class="avatar ${official ? "official" : ""}" aria-hidden="true">${esc(p.init)}</span>
      <div><b>${esc(p.by)}</b> <span class="badge ${official ? "official" : ""}">${esc(p.role)}</span>
        <div class="muted small">#${esc(p.ch)}, ${fAgo(p.at)}, <span class="vis">${p.share ? FIC.globe + " Shareable" : FIC.lock + " CAMP only"}</span></div></div>
      ${p.pinned ? `<span class="pill ok">Pinned</span>` : ""}</header>
    ${banner}
    <p class="post-t">${esc(p.text)}</p>
    ${p.img ? `<img class="post-img" src="${p.img}" alt="Photo shared by ${esc(p.by)}">` : ""}
    ${p.status === "live" ? `<div class="post-a">
      <button data-feed="like" data-id="${p.id}" aria-pressed="${p.liked}" ${canAct ? "" : "disabled"} aria-label="Like, ${p.likes}">${p.liked ? FIC.likeOn : FIC.like}<span class="num">${p.likes}</span><span class="lbl">Like</span></button>
      <button data-feed="cmts" data-id="${p.id}" aria-expanded="${!!open}" aria-label="Comments, ${p.comments.length}">${FIC.cmt}<span class="num">${p.comments.length}</span><span class="lbl">Comment</span></button>
      <button data-feed="share" data-id="${p.id}" class="${p.share ? "" : "locked"}" aria-label="${p.share ? "Share" : "CAMP only, can't be shared outside"}">${p.share ? FIC.share : FIC.lock}<span class="lbl">${p.share ? "Share" : "CAMP only"}</span></button>
      ${mine || role() === "guest" ? `<span></span>` : `<button data-feed="report" data-id="${p.id}" aria-label="Report post">${IC.flag}<span class="lbl">Report</span></button>`}
    </div>` : ""}
    ${open ? `<div class="cmts">${p.comments.map(c => `<div class="cmt"><span class="avatar" aria-hidden="true">${esc(c.init)}</span><div class="cmt-b"><b class="small">${esc(c.by)}</b><div>${esc(c.text)}</div></div></div>`).join("") || `<p class="muted small" style="margin:0">No comments yet.</p>`}
      ${canAct ? `<form class="cmt-form" data-pid="${p.id}"><label class="sr" for="c-${p.id}">Write a comment</label><input id="c-${p.id}" maxlength="300" placeholder="Write a comment" autocomplete="off"><button class="btn primary sm">Send</button></form>` : ""}</div>` : ""}
  </article>`;
}
function queueView(q) {
  return `<p class="muted" style="margin:0">${role() === "faculty" ? "You review posts in #EMS. Deans and Operations review all channels." : "Posts held by the automatic checks or reported by the community."}</p>
  <div class="stack">${q.map(p => `<article class="card post"><header class="post-h"><span class="avatar" aria-hidden="true">${esc(p.init)}</span><div><b>${esc(p.by)}</b> <span class="badge">${esc(p.role)}</span><div class="muted small">#${esc(p.ch)}, ${fAgo(p.at)}</div></div><span class="pill ${/threat|support/i.test(p.reason) ? "bad" : "warn"}">${esc(p.reason)}</span></header>
    <p class="post-t">${esc(p.text)}</p>${p.img ? `<img class="post-img" src="${p.img}" alt="Photo waiting for review">` : ""}
    <div class="row"><button class="btn primary sm" data-feed="approve" data-id="${p.id}">Approve</button><button class="btn sm" data-feed="remove" data-id="${p.id}">Remove</button><button class="btn sm" data-feed="warn" data-id="${p.id}">Remove and warn author</button></div></article>`).join("") || `<div class="card"><b>All caught up.</b><p class="muted" style="margin:4px 0 0">Nothing is waiting for review.</p></div>`}</div>`;
}
function feedTodayCard() {
  const st = me(); const p = POSTS.filter(x => x.status === "live" && (x.ch === st.program || x.ch === "Wins")).sort((a, b) => b.at - a.at)[0];
  return { icon: FIC.chat, label: "Campus Feed", body: p ? `<div><b>${esc(p.by)}</b> <span class="muted small">in #${esc(p.ch)}</span></div><p style="margin:4px 0 10px">${esc(p.text.length > 130 ? p.text.slice(0, 127).trim() + "..." : p.text)}</p><button class="btn sm" data-act="toMore" data-v="feed">Open Campus Feed</button>` : `<button class="btn sm" data-act="toMore" data-v="feed">Open Campus Feed</button>` };

function feedQueueNote() { const n = queue().length; return n ? `<div class="note warn"><b>${n} Campus Feed post${n > 1 ? "s" : ""} waiting for review.</b> <button class="linkbtn" data-feed="openQueue">Review now</button></div>` : ""; }

/* ---------- sharing ---------- */
function shareCaption(p) {
  return `${p.text}\n\nShared from CAMP Connect by ${p.by}, ${p.role === "Official" ? "CAMP Community College" : p.role.toLowerCase() + " at CAMP Community College"}.\n#CAMPConnect #GrowYourFuture #${p.ch}`;
}
function postUrl(p) { return SHARE_BASE + "#post-" + p.id; }
function shareDialog(p) {
  const cap = shareCaption(p), url = postUrl(p), enc = encodeURIComponent;
  const shortText = (p.text.length > 200 ? p.text.slice(0, 197).trim() + "..." : p.text) + " #CAMPConnect #GrowYourFuture";
  const links = [
    ["LinkedIn", `https://www.linkedin.com/sharing/share-offsite/?url=${enc(url)}`],
    ["Facebook", `https://www.facebook.com/sharer/sharer.php?u=${enc(url)}`],
    ["X", `https://twitter.com/intent/tweet?text=${enc(shortText)}&url=${enc(url)}`],
    ["Threads", `https://www.threads.net/intent/post?text=${enc(shortText + " " + url)}`],
  ];
  dialog(`<h2 id="dlh">Share this post</h2>
    <p class="muted" style="margin:0">Copy the caption to any app, or open a share window. Comments are never shared.</p>
    <label for="capbox" style="font-weight:600;font-size:.875rem">Caption</label>
    <textarea id="capbox" class="caption-box" readonly>${esc(cap + "\n" + url)}</textarea>
    <div class="share-grid"><button class="btn primary" data-feed="copycap" data-id="${p.id}">Copy caption</button><button class="btn" data-feed="copylink" data-id="${p.id}">Copy link</button>
      ${links.map(([n, u]) => `<a class="btn" href="${u}" target="_blank" rel="noopener noreferrer" data-feed="shared" data-id="${p.id}">${n}</a>`).join("")}
      ${navigator.share ? `<button class="btn" data-feed="native" data-id="${p.id}">More apps</button>` : ""}</div>
    <p class="muted small" style="margin:0"><b>Instagram or TikTok:</b> tap Copy caption, then paste it into your post in the app. Please share your own wins and posts you have permission to share.</p>
    <button class="btn ghost" data-act="close">Done</button>`);
}
function copyText(txt, okMsg) {
  const done = () => toast(okMsg);
  const fallback = () => { const box = document.getElementById("capbox"); if (box) { box.focus(); box.select(); } toast("Select the text and copy it with your device's Copy command."); };
  try { (navigator.clipboard && navigator.clipboard.writeText(txt) || Promise.reject()).then(done, fallback); } catch (e) { fallback(); }
}

/* ---------- guidelines, report ---------- */
function rulesDialog() {
  dialog(`<h2 id="dlh">Campus Feed community guidelines</h2>
    <p style="margin:0">Campus Feed is for learning, encouragement, and campus life. Everything here follows the CAMP Student Code of Conduct and employee policies.</p>
    <ul style="margin:0;padding-left:20px;display:grid;gap:6px">
      <li><b>Be respectful.</b> No bullying, harassment, hate speech, or threats.</li>
      <li><b>Keep it clean.</b> No profanity, sexual content, or graphic images.</li>
      <li><b>Protect privacy.</b> Don't post phone numbers, addresses, ID numbers, grades, or health information, yours or anyone else's.</li>
      <li><b>Photos need permission.</b> Only post photos of people who agreed to it.</li>
      <li><b>Academic honesty.</b> Study together, but don't share or ask for test answers or graded work.</li>
      <li><b>No spam or ads.</b> Links outside .edu and .gov are reviewed first.</li>
      <li><b>Share out with care.</b> Only posts marked Shareable can be copied to other social media.</li>
    </ul>
    <div class="note small">Posts are checked automatically, and anyone can report a post. Moderators review reports on weekdays. Posts about safety go to Campus Safety right away. If someone is in danger, call 911.</div>
    <button class="btn primary" data-act="close">Got it</button>`);
}
function reportDialog(p) {
  const reasons = ["Disrespectful or bullying", "Inappropriate content", "Personal information", "Academic dishonesty", "Spam or scam", "Safety concern"];
  dialog(`<h2 id="dlh">Report this post</h2><p class="muted" style="margin:0">Reports are private. The author won't see who reported it.</p>
    <form id="reportForm" data-id="${p.id}" class="stack">${reasons.map((r, i) => `<label class="switch"><input type="radio" name="rr" value="${r}" ${i === 0 ? "checked" : ""}> ${r}</label>`).join("")}
    <div class="row"><button class="btn primary">Send report</button><button type="button" class="btn" data-act="close">Cancel</button></div></form>`);
}

/* ---------- events ---------- */
const findPost = id => POSTS.find(p => p.id === id);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-feed]"); if (!b) return;
  const a = b.dataset.feed, p = b.dataset.id ? findPost(b.dataset.id) : null;
  if (a === "shared") { if (p) { p.shares++; log(`Shared post ${p.id} to ${b.textContent.trim()}`); } return; }
  const acts = {
    ch: () => { S.feedCh = b.dataset.v; render(); },
    tab: () => { S.feedTab = b.dataset.v; render(); },
    vis: () => { S.feedVis = b.dataset.v; render(); },
    rules: rulesDialog,
    photo: () => { const f = document.getElementById("fPhoto"); f && f.click(); },
    unphoto: () => { S.feedPhoto = null; render(); },
    like: () => { if (!p) return; p.liked = !p.liked; p.likes += p.liked ? 1 : -1; render(); },
    cmts: () => { S.openCmts[p.id] = !S.openCmts[p.id]; render(); if (S.openCmts[p.id]) { const i = document.getElementById("c-" + p.id); i && i.focus({ preventScroll: true }); } },
    share: () => { if (!p.share) { toast("This post stays inside CAMP. Only posts marked Shareable can go to other social media."); return; } shareDialog(p); },
    copycap: () => { p.shares++; copyText(shareCaption(p) + "\n" + postUrl(p), "Caption copied. Paste it into any social media app."); },
    copylink: () => { copyText(postUrl(p), "Link copied."); },
    native: () => { try { navigator.share({ title: "CAMP Connect", text: shareCaption(p), url: postUrl(p) }).then(() => { p.shares++; }, () => {}); } catch (x) { toast("Sharing isn't available here. Use Copy caption."); } },
    report: () => reportDialog(p),
    approve: () => { p.status = "live"; log(`Approved Campus Feed post ${p.id} (${p.reason})`); render(); toast("Approved. The post is now live."); },
    remove: () => { p.status = "removed"; p.removeReason = p.reason; log(`Removed Campus Feed post ${p.id} (${p.reason})`); render(); toast("Removed. The author was notified."); },
    warn: () => { p.status = "removed"; p.removeReason = p.reason; log(`Removed post ${p.id} and warned ${p.by} (${p.reason})`); render(); toast(`Removed. ${p.by} received a guidelines warning.`); },
    careHelp: () => { closeDialog(); go("help"); },
    openQueue: () => { S.feedTab = "queue"; go("more", null, "feed"); S.feedTab = "queue"; render(); },
  };
  acts[a] && acts[a]();
});
document.addEventListener("input", e => {
  if (e.target.id === "fText") { S.feedDraft = e.target.value; const c = document.getElementById("fCount"); if (c) c.textContent = S.feedDraft.length + "/500"; }
});
document.addEventListener("change", e => {
  if (e.target.id === "fCh") S.feedCh2 = e.target.value;
  if (e.target.id === "fPhoto") {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) { toast("Choose a photo file (JPG, PNG, or HEIC)."); return; }
    if (f.size > 8 * 1024 * 1024) { toast("That photo is over 8 MB. Choose a smaller one."); return; }
    const rd = new FileReader(); rd.onload = () => { S.feedPhoto = rd.result; render(); }; rd.readAsDataURL(f);
  }
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "feedForm") {
    e.preventDefault();
    const meF = feedMe(); if (!meF) return;
    const text = (document.getElementById("fText").value || "").trim();
    const consent = !!(document.getElementById("fConsent") && document.getElementById("fConsent").checked);
    const recent = POSTS.filter(p => p.by === meF.by && Date.now() - p.at < 3600000).length;
    const r = checkPost(text, { photo: !!S.feedPhoto, consent, recent, role: meF.role });
    if (r.v === "block") { dialog(`<h2 id="dlh">${esc(r.title)}</h2><p style="margin:0">${esc(r.msg)}</p><p class="muted small" style="margin:0">Your draft is saved.</p><div class="row"><button class="btn primary" data-act="close">Edit my post</button><button class="btn" data-feed="rules">See guidelines</button></div>`); return; }
    const post = { id: "p" + Math.floor(Math.random() * 900000 + 1000), by: meF.by, role: meF.role, init: meF.init, ch: S.feedCh2, at: Date.now(), share: S.feedVis === "share", likes: 0, liked: false, reports: 0, shares: 0, comments: [], text, img: S.feedPhoto, status: r.v === "ok" ? "live" : "held", reason: r.reason, pinned: false };
    POSTS.unshift(post);
    S.feedDraft = ""; S.feedPhoto = null;
    if (r.v === "ok") { log(`Posted to Campus Feed #${post.ch}`); S.feedTab = "feed"; render(); toast(`Posted to #${post.ch}.`); return; }
    log(`Campus Feed post held: ${r.reason}${r.safety ? " (Campus Safety notified)" : ""}${r.care ? " (Counseling notified)" : ""}`);
    S.feedTab = "mine"; render();
    dialog(`<h2 id="dlh">${esc(r.title)}</h2><p style="margin:0">${esc(r.msg)}</p>${r.safety ? `<a class="btn danger" href="tel:911">Call 911</a>` : ""}${r.care ? `<div class="row"><button class="btn primary" data-feed="careHelp">Contact Counseling</button></div>` : ""}<button class="btn ghost" data-act="close">OK</button>`);
  }
  if (f.classList && f.classList.contains("cmt-form")) {
    e.preventDefault();
    const p = findPost(f.dataset.pid), meF = feedMe(), inp = f.querySelector("input"), text = (inp.value || "").trim();
    if (!p || !meF || !text) return;
    const r = checkPost(text, {});
    if (r.v === "block") { toast(r.msg); return; }
    if (r.v === "hold") { log(`Comment held on ${p.id}: ${r.reason}`); inp.value = ""; toast(r.safety ? "Comment not posted. It was sent to Campus Safety for review." : r.care ? "Comment not posted. A counselor will reach out. In a crisis, call or text 988." : "Comment sent to a moderator for review."); return; }
    p.comments.push({ by: meF.by, init: meF.init, text }); render(); const i = document.getElementById("c-" + p.id); i && i.focus({ preventScroll: true });
  }
  if (f.id === "reportForm") {
    e.preventDefault();
    const p = findPost(f.dataset.id), why = (f.querySelector('input[name="rr"]:checked') || {}).value || "Inappropriate content";
    p.reports++; S.hiddenForMe[p.id] = true;
    if (p.reports >= 3 || why === "Safety concern") { p.status = "held"; p.reason = `Reported${p.reports > 1 ? " " + p.reports + " times" : ""}: ${why.toLowerCase()}`; }
    log(`Reported post ${p.id}: ${why}`);
    closeDialog(); render(); toast(why === "Safety concern" ? "Thanks. Campus Safety was notified. If anyone is in danger, call 911." : "Thanks for reporting. You won't see this post while a moderator reviews it.");

function drawQR() {
  const c = document.getElementById("qr"); if (!c) return; const g = c.getContext("2d"); const n = 25, s = c.width / n; let seed = [...(STUDENTS[S.who]?.id || "E0912")].reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7);
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280; g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#111";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (rnd() > .52) g.fillRect(x * s, y * s, s, s);
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([x, y]) => { g.fillStyle = "#111"; g.fillRect(x * s, y * s, 7 * s, 7 * s); g.fillStyle = "#fff"; g.fillRect((x + 1) * s, (y + 1) * s, 5 * s, 5 * s); g.fillStyle = "#111"; g.fillRect((x + 2) * s, (y + 2) * s, 3 * s, 3 * s); });
}

let sim = null;
function sendAlert(type, target, msg, drill) {
  let blds = BUILDINGS, label = "All campuses";
  if (target.startsWith("c:")) { const c = target.slice(2); blds = BUILDINGS.filter(b => b.campus === c); label = c + " campus"; }
  if (target.startsWith("b:")) { const id = target.slice(2); blds = BUILDINGS.filter(b => b.id === id); label = bName(id); }
  const base = { "Nursing & Allied Health Building": 64, "Main Building": 88, "Workforce Development Center": 31, "Regional Workforce Development Center": 42, "Smithfield Center": 27 };
  S.alert = { type, target, targetLabel: label, msg, drill, at: Date.now(), rows: blds.map(b => ({ name: b.name, campus: b.campus, inn: base[b.name] || 30, safe: 0, help: 0 })), helpList: [], roster: ROSTER.map(() => "No response") };
  S.myResponse = null; S.alertDismissed = false;
  log(`Sent ${drill ? "DRILL " : ""}alert "${type}" to ${label}`);
  clearInterval(sim);
  sim = setInterval(() => {
    const A = S.alert; if (!A) return clearInterval(sim);
    A.rows.forEach(r => { const left = r.inn - r.safe - r.help; if (left > Math.round(r.inn * .06)) r.safe += Math.min(left, 1 + Math.floor(Math.random() * Math.max(2, r.inn / 9))); });
    if (!A.helpOnce && Date.now() - A.at > 5000) { A.helpOnce = true; const r = A.rows[0]; r.help += 1; A.helpList.push(`1 person, ${r.name}, ${r.campus} (simulated)`); }
    A.roster = A.roster.map((s, i) => s === "No response" && Math.random() > .55 ? (i === 6 && Math.random() > .5 ? "Need help" : "Safe") : s);
    if (S.who === "maria" && S.myResponse) A.roster[0] = S.myResponse === "I'm safe" ? "Safe" : "Need help";
    softRefresh();
  }, 1400);
}
function softRefresh() {
  // re-render only if no text field is being edited
  const a = document.activeElement; if (a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox"))) return;

  if (e.target.closest && e.target.closest("#searchToggle")) { S.searchOpen = !S.searchOpen; if (!S.searchOpen) S.searchQ = ""; render(); if (S.searchOpen) { const q = document.getElementById("q"); q && q.focus(); } return; }
  if (e.target.id === "theme") { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("cc-theme", nx); } catch (x) {} syncThemeColor(); }
});

render();
if (S.feedFocus) { const el = document.getElementById(S.feedFocus); el && el.scrollIntoView({ block: "start" }); }
})();
</script>
