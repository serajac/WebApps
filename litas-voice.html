<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lita">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Lita's Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600&display=swap">
<style>
/* Layout: one-screen tablet app. Message strip on top, the active space in the middle, a big tab dock at the bottom.
   Low-arousal sage/blue palette; talk buttons use the Fitzgerald Key colors AAC users and therapists already know. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#1D2A2C; --muted:#4F5E63; --line:#C7D2CC; --soft:#E0E8E3;
  --accent:#2F5D8A; --accent-ink:#FFFFFF; --scrim:rgba(16,28,30,.5); --good:#2E7D4F;
  --calm1:#BFD9EC; --calm2:#7FAFD3; --paper:#FFFFFF;
  --people-bg:#FFF2C2; --people-bd:#B8931A;
  --verb-bg:#DCF1D6;   --verb-bd:#4A9441;
  --desc-bg:#DAE9F9;   --desc-bd:#3A77BA;
  --noun-bg:#FCE2CB;   --noun-bd:#C9722A;
  --social-bg:#FADCE7; --social-bd:#BB4B79;
  --question-bg:#E8DFF7; --question-bd:#7556B0;
  --neg-bg:#F8D8D5;    --neg-bd:#B83C35;
  --folder-bg:#E4E7E2; --folder-bd:#66715F;
  --f-display:"Lexend","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  --radius:18px; --gap:10px; --tscale:1;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131A1C; --surface:#1C2528; --ink:#E6EDEC; --muted:#A9B7B6; --line:#34423F; --soft:#26312F;
  --accent:#8DB6E0; --accent-ink:#0F1C28; --scrim:rgba(0,0,0,.62); --good:#6FC28F;
  --calm1:#2B4A63; --calm2:#4F7FA6; --paper:#FAFAF7;
  --people-bg:#39321A; --people-bd:#D6B54A;
  --verb-bg:#1E331F;   --verb-bd:#6EBD64;
  --desc-bg:#1A2A3C;   --desc-bd:#7EAEE4;
  --noun-bg:#392616;   --noun-bd:#E49D5C;
  --social-bg:#3A1D29; --social-bd:#E083A9;
  --question-bg:#2A2140; --question-bd:#A88AE0;
  --neg-bg:#3B1B19;    --neg-bd:#E4766E;
  --folder-bg:#262B25; --folder-bd:#9DA898;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131A1C; --surface:#1C2528; --ink:#E6EDEC; --muted:#A9B7B6; --line:#34423F; --soft:#26312F;
  --accent:#8DB6E0; --accent-ink:#0F1C28; --scrim:rgba(0,0,0,.62); --good:#6FC28F;
  --calm1:#2B4A63; --calm2:#4F7FA6; --paper:#FAFAF7;
  --people-bg:#39321A; --people-bd:#D6B54A;
  --verb-bg:#1E331F;   --verb-bd:#6EBD64;
  --desc-bg:#1A2A3C;   --desc-bd:#7EAEE4;
  --noun-bg:#392616;   --noun-bd:#E49D5C;
  --social-bg:#3A1D29; --social-bd:#E083A9;
  --question-bg:#2A2140; --question-bd:#A88AE0;
  --neg-bg:#3B1B19;    --neg-bd:#E4766E;
  --folder-bg:#262B25; --folder-bd:#9DA898;
  color-scheme:dark }
/* High-contrast mode (grown-up setting): pure black on white, heavy borders */
.app.hc{ --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#1A1A1A; --line:#000000; --soft:#F0F0F0; --accent:#003A8C; --accent-ink:#FFFFFF;
  --people-bg:#FFF; --verb-bg:#FFF; --desc-bg:#FFF; --noun-bg:#FFF; --social-bg:#FFF; --question-bg:#FFF; --neg-bg:#FFF; --folder-bg:#FFF; color:#000; background:#FFF }
.app.hc .tile{border-width:5px}

*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:10px 16px;background:var(--bg)}
.app.rm *, .app.rm *::before, .app.rm *::after{transition:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important} }

/* message strip */
.msgbar{display:flex;gap:8px;align-items:stretch;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:8px}
.msgwords{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;align-items:center;padding:4px 6px;border-radius:14px;min-height:76px;background:none;border:0;text-align:left}
.chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-width:66px;padding:4px 8px;border-radius:12px;background:var(--soft);font-weight:700;font-size:.9rem;gap:2px}
.csym{font-size:1.9rem;line-height:1}
img.csym{width:42px;height:42px;object-fit:cover;border-radius:8px}
.hint{color:var(--muted);font-size:1rem;padding-left:6px}
.mbtn{flex:none;width:70px;border-radius:16px;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;font-size:1.7rem;position:relative;overflow:hidden}
.mbtn small{display:block;font-size:.72rem;font-weight:700;margin-top:-4px}
.mbtn.speak{width:100px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mbtn.gear{width:52px;font-size:1.3rem;color:var(--muted)}
.hold{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:14px;font-weight:700;text-align:center}
.editing .tile::after,.editing .ptile::after{content:"✎";position:absolute;top:6px;left:8px;font-size:1rem;background:var(--surface);color:var(--ink);border-radius:8px;padding:0 5px}
.editing .tile.addtile::after,.editing .ptile.addtile::after{content:none}
.quickedit{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:16px;background:var(--desc-bg);border:2px solid var(--desc-bd)}
.hold::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--accent);transform:scaleX(0);transform-origin:left}
.hold.holding::after{transform:scaleX(1);transition:transform var(--hold,2000ms) linear}

/* main + dock */
.main{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-block:2px}
.main.fill{overflow:hidden}
.dock{display:flex;gap:6px;justify-content:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:6px}
.tab{flex:1;max-width:124px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:15px;border:0;background:none;font-weight:700;font-size:.85rem;color:var(--muted)}
.tab .ti{font-size:1.7rem;line-height:1.1}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* talk grid */
.boardhead{display:flex;align-items:center;gap:12px;min-height:48px}
.boardhead h2{font-size:1.35rem}
.back{padding:10px 18px;border-radius:14px;border:2px solid var(--folder-bd);background:var(--folder-bg);font-weight:700;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:var(--gap)}
.tile{position:relative;container-type:inline-size;aspect-ratio:1/1;min-width:0;border-radius:var(--radius);border:3px solid var(--cbd,var(--line));background:var(--cbg,var(--surface));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;transition:transform .08s ease}
.tile:active{transform:scale(.95)}
.tile .sym{font-size:38cqi;line-height:1.05}
.tile img.sym{width:74%;height:60%;object-fit:cover;border-radius:12px}
.tile .lbl{font-weight:700;font-size:calc(clamp(.72rem,12cqi,1.4rem) * var(--tscale));text-align:center;line-height:1.1;overflow-wrap:anywhere;max-width:100%}
.tile.ghost{visibility:hidden}
.tile.is-hidden{opacity:.45;border-style:dashed}
.tile.addtile{border-style:dashed;background:var(--surface)}
.sndmark{position:absolute;top:4px;right:8px;font-size:.9rem;color:var(--muted)}
.c-people{--cbg:var(--people-bg);--cbd:var(--people-bd)} .c-verb{--cbg:var(--verb-bg);--cbd:var(--verb-bd)}
.c-desc{--cbg:var(--desc-bg);--cbd:var(--desc-bd)} .c-noun{--cbg:var(--noun-bg);--cbd:var(--noun-bd)}
.c-social{--cbg:var(--social-bg);--cbd:var(--social-bd)} .c-question{--cbg:var(--question-bg);--cbd:var(--question-bd)}
.c-neg{--cbg:var(--neg-bg);--cbd:var(--neg-bd)} .c-folder{--cbg:var(--folder-bg);--cbd:var(--folder-bd)}
.c-folder::before{content:"";position:absolute;top:-3px;left:12%;width:38%;height:11px;background:var(--cbd);border-radius:0 0 9px 9px}
.editbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;border-radius:16px;background:var(--desc-bg);border:2px solid var(--desc-bd);font-weight:700}
.sect{font-size:1.15rem;color:var(--muted)}

/* generic controls */
.btn{padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:var(--soft);font-weight:700;position:relative;overflow:hidden}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--neg-bd);background:var(--neg-bg)}
.btn.small{padding:8px 12px;font-size:.9rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:22px;width:min(780px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dhead h2{font-size:1.4rem}
.dfoot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.field{display:grid;gap:6px}
.flabel{font-weight:700}
.fhint{color:var(--muted);font-size:.9rem;max-width:62ch}
.text{padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);width:100%}
select.text{min-height:48px}
.tog{display:flex;align-items:center;gap:10px;font-weight:700;min-height:44px}
.tog input{width:26px;height:26px;accent-color:var(--accent)}
.gsec{border:2px solid var(--line);border-radius:16px;padding:0 14px}
.gsec summary{font-family:var(--f-display);font-weight:600;font-size:1.1rem;padding:14px 0;cursor:pointer}
.gbody{display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
.preview{width:96px;height:96px;border-radius:16px;border:3px solid var(--line);display:grid;place-items:center;font-size:3rem;overflow:hidden;background:var(--bg)}
.preview img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.listrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--bg)}
.listrow .csym{width:42px;text-align:center}
.listrow span.grow{flex:1;min-width:0;font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.thumb{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--paper)}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.thumb .mood{position:absolute;left:6px;bottom:6px;font-size:1.4rem}
.thumb .x{position:absolute;right:4px;top:4px;border:0;border-radius:10px;background:var(--surface);padding:4px 8px;font-weight:700}
table.prog{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.prog th,table.prog td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend span{padding:6px 10px;border-radius:10px;border:2px solid var(--cbd);background:var(--cbg);font-weight:700;font-size:.9rem}

/* my day */
.day{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ftslot{border:3px solid var(--line);border-radius:18px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;min-height:170px}
.ftslot h3{font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ftslot .sym{font-size:4rem;line-height:1}
.ftslot img.sym{width:110px;height:110px;object-fit:cover;border-radius:14px}
.ftslot .lbl{font-weight:700;font-size:1.25rem}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.step{position:relative;border:3px solid var(--line);border-radius:18px;background:var(--surface);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.step .sym{font-size:3rem;line-height:1}
.step img.sym{width:80px;height:80px;object-fit:cover;border-radius:12px}
.step .lbl{font-weight:700}
.step.now{border-color:var(--accent);border-width:4px;background:var(--desc-bg)}
.step.now::before{content:"Now";position:absolute;top:-12px;background:var(--accent);color:var(--accent-ink);font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px}
.step.done{opacity:.5}
.step.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;color:var(--good);font-weight:700}
.timerwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
#timerc{width:220px;height:220px;max-width:100%}

/* learn */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.game{border:3px solid var(--line);border-radius:20px;background:var(--surface);padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.game .sym{font-size:3.4rem}
.game b{font-family:var(--f-display);font-size:1.2rem}
.game span{color:var(--muted)}
.stars{display:flex;gap:6px;font-size:1.8rem}
.stars i{font-style:normal;opacity:.25;transition:opacity .3s, transform .3s}
.stars i.on{opacity:1;transform:scale(1.15)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px}
.prompt .big{font-size:5rem;line-height:1}
.prompt img.big{width:150px;height:150px;object-fit:cover;border-radius:18px}
.prompt .word{font-family:var(--f-display);font-size:2rem;font-weight:600}
.countrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:3.4rem;max-width:560px}
.choices{display:grid;grid-template-columns:repeat(var(--n),minmax(0,190px));gap:14px;justify-content:center}
.choice{aspect-ratio:1/1;border-radius:20px;border:3px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;container-type:inline-size;transition:opacity .3s, transform .15s}
.choice .sym{font-size:42cqi;line-height:1}
.choice img.sym{width:78%;height:70%;object-fit:cover;border-radius:14px}
.choice .num{font-family:var(--f-display);font-size:48cqi;font-weight:600}
.choice .dot{width:62%;aspect-ratio:1;border-radius:50%;border:3px solid var(--line)}
.choice .lbl{font-weight:700}
.choice.faded{opacity:.25;pointer-events:none}
.choice.right{border-color:var(--good);border-width:6px}
.choice.cue{animation:cue 1.4s ease-in-out infinite}
@keyframes cue{50%{transform:scale(1.06);border-color:var(--accent)}}

/* art */
.artwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;height:100%;min-height:0}
.tools{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px}
.swatches{display:grid;grid-template-columns:repeat(2,48px);gap:8px}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid var(--line)}
.sw[aria-pressed="true"]{outline:4px solid var(--accent);outline-offset:2px}
.tbtn{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sizes .tbtn i{display:block;border-radius:50%;background:currentColor}
.canvasbox{position:relative;min-height:0;min-width:0}
.artcanvas{position:absolute;inset:0;width:100%;height:100%;border-radius:18px;border:2px solid var(--line);background:var(--paper);touch-action:none;display:block}
.moodask{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.moodask button{font-size:2.2rem;width:64px;height:64px;border-radius:16px;border:2px solid var(--line);background:var(--bg)}

/* music + calm */
.subnav{display:flex;flex-wrap:wrap;gap:8px}
.xylo{flex:1;min-height:240px;display:flex;gap:10px;align-items:center}
.bar{flex:1;min-width:0;height:var(--h);border-radius:18px;border:3px solid var(--line);background:var(--c);position:relative;touch-action:none;transition:filter .1s, transform .1s}
.bar::before,.bar::after{content:"";position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);opacity:.8}
.bar::before{top:12%} .bar::after{bottom:12%}
.bar.hit{filter:brightness(1.15);transform:scale(.97)}
.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;flex:1}
.pad{border-radius:22px;border:3px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:1.1rem;min-height:120px;touch-action:none}
.pad .sym{font-size:3rem}
.pad.hit{background:var(--soft);transform:scale(.97)}
.calmstage{flex:1;min-height:300px;display:grid;place-items:center;position:relative}
.breath{width:min(62vmin,360px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--calm1),var(--calm2));transform:scale(.5);display:grid;place-items:center;transition-property:transform;transition-timing-function:ease-in-out}
.breath span{font-family:var(--f-display);font-size:1.6rem;font-weight:600;color:var(--ink);background:var(--surface);padding:6px 16px;border-radius:999px}
.bubbles{position:absolute;inset:0;width:100%;height:100%;border-radius:20px;background:var(--surface);border:2px solid var(--line);touch-action:none}
.soundgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;width:100%}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

@media (max-width:760px){
  .day{grid-template-columns:1fr}
  .artwrap{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .tools{flex-direction:row;flex-wrap:wrap}
  .swatches{grid-template-columns:repeat(5,40px)} .sw{width:40px;height:40px}
}
@media (max-width:520px){
  .app{padding:8px 16px;gap:8px}
  .mbtn{width:54px;font-size:1.4rem} .mbtn.speak{width:66px} .mbtn.gear{width:40px}
  .msgwords{min-height:64px}
  .tab{font-size:.7rem} .tab .ti{font-size:1.4rem}
  .pads{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* phrases */
.phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--gap)}
.ptile{position:relative;display:flex;align-items:center;gap:12px;min-height:84px;padding:10px 14px;border-radius:var(--radius);border:3px solid var(--cbd,var(--line));background:var(--cbg,var(--surface));text-align:left;transition:transform .08s ease}
.ptile:active{transform:scale(.97)}
.ptile .sym{font-size:2.4rem;line-height:1;flex:none}
.ptile img.sym{width:56px;height:56px;object-fit:cover;border-radius:10px}
.ptile .lbl{font-weight:700;font-size:calc(1.1rem * var(--tscale));line-height:1.25;min-width:0}
.ptile.is-hidden{opacity:.45;border-style:dashed}
.ptile.ghost{visibility:hidden}
.gsect{display:flex;flex-direction:column;gap:10px}
.gsect > h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lvl{padding:3px 12px;border-radius:999px;background:var(--soft);font-weight:700;font-size:.85rem;color:var(--ink)}

/* math */
.group{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;font-size:2.3rem;line-height:1;max-width:280px;padding:10px;border-radius:16px;background:var(--soft)}
.group img.csym{width:40px;height:40px}
.group .gone{opacity:.25}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px}
.op{font-family:var(--f-display);font-size:3rem;font-weight:600}
.bignum{font-family:var(--f-display);font-size:6rem;font-weight:600;line-height:1}
.choice.grp{aspect-ratio:auto;min-height:150px;padding:10px}
.choice.grp .group{background:none;font-size:1.7rem;max-width:100%}
.choice.grp .group img.csym{width:30px;height:30px}
.patrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center}
.pcell{width:84px;height:84px;border-radius:16px;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:3rem;overflow:hidden}
.pcell img{width:100%;height:100%;object-fit:cover}
.pcell.q{border-style:dashed;font-family:var(--f-display);color:var(--muted)}

/* jigsaw */
.jig{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center}
.jboard{display:grid;border:3px solid var(--line);border-radius:14px;background:var(--soft);position:relative;overflow:hidden;flex:none;max-width:100%}
.jghost{position:absolute;inset:0;opacity:.2;background-size:cover;pointer-events:none}
.jcell{position:relative;outline:1px dashed var(--line);outline-offset:-1px}
.jtray{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center;flex:1;min-width:220px;padding:10px;border:2px dashed var(--line);border-radius:14px;min-height:120px}
.piece{border:2px solid var(--surface);border-radius:6px;background-repeat:no-repeat;touch-action:none;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.piece.sel{outline:4px solid var(--accent);outline-offset:2px}
.piece.drag{position:fixed;z-index:60;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.jcell .piece{position:absolute;inset:0;width:100%!important;height:100%!important;border:0;border-radius:0;box-shadow:none}
.srcs{display:flex;flex-wrap:wrap;gap:10px}
.src{width:76px;height:76px;border-radius:14px;border:3px solid var(--line);background-size:cover;background-position:center;padding:0}
.src[aria-pressed="true"]{outline:4px solid var(--accent);outline-offset:2px}
.donebox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}

/* memory */
.mem{display:grid;grid-template-columns:repeat(var(--mc),minmax(0,150px));gap:12px;justify-content:center}
.mcard{aspect-ratio:1/1;border-radius:18px;border:3px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;container-type:inline-size;padding:0;font-size:2rem}
.mcard.open{background:var(--surface);color:var(--ink);border-color:var(--line)}
.mcard .sym{font-size:48cqi;line-height:1}
.mcard img.sym{width:80%;height:80%;object-fit:cover;border-radius:12px}
.mcard.matched{border-color:var(--good);border-width:6px}

/* stories */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.reader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;min-height:0}
.reader .pic{font-size:7rem;line-height:1}
.reader img.pic{width:min(360px,80vw);height:min(260px,36vh);object-fit:cover;border-radius:20px;border:3px solid var(--line)}
.reader p{font-family:var(--f-display);font-size:calc(1.7rem * var(--tscale));font-weight:500;max-width:28ch;margin:0;text-wrap:balance;line-height:1.3}
.pdots{display:flex;gap:8px}
.pdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pdots i.on{background:var(--accent)}
.navrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.navrow .btn{min-width:130px;font-size:1.2rem;padding:16px 22px}

/* log */
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{padding:10px 14px;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;min-width:120px}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
textarea.text{min-height:160px;resize:vertical}

.game img.sym{width:96px;height:96px;object-fit:cover;border-radius:14px}
.ptile.addtile{border-style:dashed;background:var(--surface)}
@media (max-width:520px){ .tab .ti{font-size:1.25rem} .tab{font-size:.62rem} .dock{gap:2px;padding:4px} }
</style>

function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){ if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style'&&typeof v==='object'){for(const[p,val]of Object.entries(v)){p.startsWith('--')?e.style.setProperty(p,val):e.style[p]=val}}
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e}

/* ---------- storage: IndexedDB with in-memory fallback ---------- */
const mem={kv:{},media:{}};
const DB={db:null,
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('litas-voice',1);
      r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('media')};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);setTimeout(()=>rej(new Error('timeout')),4000)})}catch(e){this.db=null}},
  req(store,mode,fn){return new Promise((res,rej)=>{try{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}catch(e){rej(e)}})},
  async get(s,k){if(this.db){try{return await this.req(s,'readonly',st=>st.get(k))}catch(e){}}return mem[s][k]},
  async put(s,k,v){mem[s][k]=v;if(this.db){try{await this.req(s,'readwrite',st=>st.put(v,k))}catch(e){}}},
  async del(s,k){delete mem[s][k];if(this.db){try{await this.req(s,'readwrite',st=>st.delete(k))}catch(e){}}},
  async clear(s){mem[s]={};if(this.db){try{await this.req(s,'readwrite',st=>st.clear())}catch(e){}}}
};
const urls={};
async function putMedia(blob){const k=uid('m');await DB.put('media',k,blob);urls[k]=URL.createObjectURL(blob);return k}
async function dropMedia(k){if(!k)return;if(urls[k]){URL.revokeObjectURL(urls[k]);delete urls[k]}await DB.del('media',k)}
function mediaKeys(){const ks=new Set();const add=k=>k&&ks.add(k);
  Object.values(S.buttons).forEach(b=>{add(b.img);add(b.snd)});S.schedule.forEach(s=>add(s.img));
  [S.firstThen.first,S.firstThen.then].forEach(s=>s&&add(s.img));S.songs.forEach(s=>{add(s.img);add(s.snd)});S.gallery.forEach(g=>add(g.k));
  S.stories.forEach(st=>{add(st.img);st.pages.forEach(p=>{add(p.img);add(p.snd)})});return[...ks]}
async function loadMedia(){for(const k of mediaKeys()){if(urls[k])continue;const b=await DB.get('media',k);if(b)urls[k]=URL.createObjectURL(b)}}

/* ---------- speech & sound playback ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if('speechSynthesis'in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function pickVoice(lang){const want=lang==='es'?S.settings.voiceEs:S.settings.voice;let v=voices.find(v=>v.voiceURI===want);
  if(!v&&lang==='es')v=voices.find(v=>/^es[-_]US/i.test(v.lang))||voices.find(v=>/^es[-_]MX/i.test(v.lang))||voices.find(v=>/^es/i.test(v.lang));return v}
function tts(text,lang=S.settings.lang){return new Promise(res=>{try{text=fill(text);
  const u=new SpeechSynthesisUtterance(text);const v=pickVoice(lang);if(v){u.voice=v;u.lang=v.lang}else u.lang=lang==='es'?'es-US':'en-US';
  u.rate=S.settings.rate;u.pitch=S.settings.pitch;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,Math.max(6000,text.length*160))}catch(e){res()}})}
function stopSpeech(){try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel()}catch(e){}}
function playURL(url){return new Promise(res=>{try{const a=new Audio(url);a.onended=a.onerror=()=>res();a.play().catch(()=>res())}catch(e){res()}})}
function sayItem(b){stopSpeech();return b.snd&&urls[b.snd]?playURL(urls[b.snd]):tts(SAYT(b))}
async function speakSeq(items){stopSpeech();let buf=[];
  for(const it of items){if(it.snd&&urls[it.snd]){if(buf.length){await tts(buf.join(' '));buf=[]}await playURL(urls[it.snd])}else buf.push(it.say||it.label)}
  if(buf.length)await tts(buf.join(' '))}

/* ---------- communication log ---------- */
function today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function logDay(){const d=today();return S.log[d]||(S.log[d]={w:{},s:0})}
function trimLog(){const ks=Object.keys(S.log).sort();while(ks.length>120)delete S.log[ks.shift()]}
function logWord(label){if(UI.edit)return;const e=logDay();e.w[label]=(e.w[label]||0)+1;trimLog();save()}
function logSentence(text){const e=logDay();e.s++;S.recent.unshift({t:Date.now(),text});S.recent=S.recent.slice(0,40);save()}
function logSummary(days){const out={taps:0,sent:0,words:{},days:[]};for(let i=0;i<days;i++){const d=new Date();d.setDate(d.getDate()-i);const k=today(d),e=S.log[k];
  const t=e?Object.values(e.w).reduce((a,b)=>a+b,0):0;out.days.push([k,t,e?e.s:0]);if(!e)continue;out.taps+=t;out.sent+=e.s;for(const[w,c]of Object.entries(e.w))out.words[w]=(out.words[w]||0)+c}
  out.top=Object.entries(out.words).sort((a,b)=>b[1]-a[1]);return out}

/* ---------- Web Audio: instruments, drums, calm sounds ---------- */
let AC,master;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();master=AC.createGain();master.gain.value=.8;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();return AC}
const PENTA=[261.63,293.66,329.63,392.0,440.0,523.25,587.33,659.25];
const INST={chimes:{parts:[['sine',1,1],['sine',2.76,.22],['sine',5.4,.07]],atk:.006,dec:2.4},
  marimba:{parts:[['sine',1,1],['sine',4,.25]],atk:.003,dec:.7},piano:{parts:[['triangle',1,1],['sine',2,.18]],atk:.005,dec:1.4}};
function note(freq,inst='chimes',vol=.32){try{const a=ac(),t=a.currentTime,cfg=INST[inst],g=a.createGain();g.connect(master);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+cfg.atk);g.gain.exponentialRampToValueAtTime(.0001,t+cfg.dec);
  cfg.parts.forEach(([type,mul,amp])=>{const o=a.createOscillator(),og=a.createGain();o.type=type;o.frequency.value=freq*mul;og.gain.value=amp;o.connect(og);og.connect(g);o.start(t);o.stop(t+cfg.dec+.05)})}catch(e){}}
let NB,BB;
function noiseBuf(){if(NB)return NB;const a=ac();NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB}
function brownBuf(){if(BB)return BB;const a=ac();BB=a.createBuffer(1,a.sampleRate*4,a.sampleRate);const d=BB.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}return BB}
function drum(kind,vol=1){try{const a=ac(),t=a.currentTime,g=a.createGain();g.connect(master);
  const tone={kick:[150,45,.4],tomlo:[140,88,.45],tomhi:[250,175,.32]}[kind];
  if(tone){const[f0,f1,d]=tone,o=a.createOscillator();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(.9*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);o.start(t);o.stop(t+d+.02)}
  else{const[type,freq,d,v]={snare:['highpass',1200,.22,.55],shaker:['highpass',5200,.1,.35],clap:['bandpass',1500,.2,.7]}[kind];
    const s=a.createBufferSource(),f=a.createBiquadFilter();s.buffer=noiseBuf();f.type=type;f.frequency.value=freq;s.connect(f);f.connect(g);
    g.gain.setValueAtTime(v*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.start(t);s.stop(t+d+.02)}}catch(e){}}
function chimeDone(){[523.25,659.25,783.99].forEach((f,i)=>setTimeout(()=>note(f,'marimba',.35),i*180))}
const CALM={nodes:[],kind:null,gain:null,vol:.5};
function stopCalm(){CALM.nodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});CALM.nodes=[];CALM.kind=null}
function startCalm(kind){stopCalm();const a=ac();const out=a.createGain();out.gain.value=CALM.vol;out.connect(master);CALM.gain=out;CALM.kind=kind;
  const keep=n=>{CALM.nodes.push(n);return n};
  if(kind==='rain'){const s=keep(a.createBufferSource());s.buffer=noiseBuf();s.loop=true;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=350;const g=a.createGain();g.gain.value=.22;s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(out);s.start()}
  if(kind==='ocean'){const s=keep(a.createBufferSource());s.buffer=brownBuf();s.loop=true;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;const g=a.createGain();g.gain.value=.35;
    const lfo=keep(a.createOscillator());lfo.frequency.value=.08;const lg=a.createGain();lg.gain.value=.3;lfo.connect(lg);lg.connect(g.gain);s.connect(lp);lp.connect(g);g.connect(out);s.start();lfo.start()}
  if(kind==='hum'){[110,164.8,220,277.2].forEach((f,i)=>{const o=keep(a.createOscillator());o.type='sine';o.frequency.value=f;o.detune.value=(i-1.5)*4;const g=a.createGain();g.gain.value=.06;o.connect(g);g.connect(out);o.start()})}
  if(kind==='night'){const s=keep(a.createBufferSource());s.buffer=brownBuf();s.loop=true;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;const g=a.createGain();g.gain.value=.5;s.connect(lp);lp.connect(g);g.connect(out);s.start()}
}

/* press-and-hold: works with finger, mouse and keyboard; a quick tap calls onTap (for a hint) */
function holdable(el,ms,fn,onTap){let t=null,firedAt=0,downAt=0;el.classList.add('hold');el.style.setProperty('--hold',ms+'ms');
  const start=e=>{if(e.cancelable)e.preventDefault();if(e.pointerId!=null){try{el.setPointerCapture(e.pointerId)}catch(_){}}
    downAt=Date.now();el.classList.add('holding');clearTimeout(t);t=setTimeout(()=>{t=null;firedAt=Date.now();el.classList.remove('holding');fn()},ms)};
  const end=()=>{const wasTap=t&&Date.now()-downAt<ms;clearTimeout(t);t=null;el.classList.remove('holding');if(wasTap&&onTap)onTap()};
  el.addEventListener('pointerdown',start);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{clearTimeout(t);t=null;el.classList.remove('holding')});
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){clearTimeout(t);t=null;el.classList.remove('holding')}});
  el.addEventListener('click',e=>{if(Date.now()-firedAt<800)e.preventDefault()});
  el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat)start(e)});el.addEventListener('keyup',end);
  el.addEventListener('contextmenu',e=>e.preventDefault())}

  el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3000)}

const TIMER={end:0,total:0,iv:null};
function startTimer(min){ac();TIMER.total=min*60000;TIMER.end=Date.now()+TIMER.total;clearInterval(TIMER.iv);TIMER.iv=setInterval(tickTimer,250);tickTimer()}
function stopTimer(){clearInterval(TIMER.iv);TIMER.iv=null;TIMER.end=0;drawTimer(0)}
function tickTimer(){const left=TIMER.end-Date.now();if(left<=0){stopTimer();chimeDone();setTimeout(()=>tts(T('allDone')),600);return}drawTimer(left)}
function drawTimer(left){const c=document.getElementById('timerc');if(!c)return;const dpr=Math.min(2,devicePixelRatio||1),s=220*dpr;if(c.width!==s){c.width=c.height=s}
  const x=c.getContext('2d'),r=s/2;x.clearRect(0,0,s,s);x.beginPath();x.arc(r,r,r*.92,0,Math.PI*2);x.fillStyle=tok('--soft');x.fill();x.lineWidth=4*dpr;x.strokeStyle=tok('--line');x.stroke();
  if(left>0){const f=left/TIMER.total;x.beginPath();x.moveTo(r,r);x.arc(r,r,r*.86,-Math.PI/2,-Math.PI/2+f*Math.PI*2);x.closePath();x.fillStyle=tok('--neg-bd');x.fill()}
  x.beginPath();x.arc(r,r,r*.3,0,Math.PI*2);x.fillStyle=tok('--surface');x.fill();
  const sec=Math.ceil(left/1000);x.fillStyle=tok('--ink');x.font=`700 ${22*dpr}px ${tok('--f-display')}`;x.textAlign='center';x.textBaseline='middle';
  x.fillText(left>0?`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`:'0:00',r,r)}

  stat.textContent='Backup file created. If nothing downloaded, open the app from its own web address and try again.'}
async function importBackup(file,stat){try{const o=JSON.parse(await file.text());if(o.app!=='litas-voice'||!o.state)throw new Error('bad');
  for(const[k,d]of Object.entries(o.media||{})){const b=dataToBlob(d);await DB.put('media',k,b);if(urls[k])URL.revokeObjectURL(urls[k]);urls[k]=URL.createObjectURL(b)}
  S=migrate(o.state);save();applySettings();closeModal();render();renderMsg()}catch(e){stat.textContent='That file is not a backup from this app. Choose the .json file you downloaded.'}}
function migrate(st){const d=defaults();if(!st||!st.buttons||!st.boards||!st.boards.home)return d;
  st.settings={...d.settings,...(st.settings||{})};st.settings.tabs={...d.settings.tabs,...(st.settings.tabs||{})};
  ['schedule','songs','gallery','stories','recent'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=d[k]});
  st.firstThen=st.firstThen||d.firstThen;st.progress=st.progress||{};st.log=st.log||{};st.levels={...d.levels,...(st.levels||{})};
  /* add new default boards (with fresh ids) that older saves don't have */
  for(const[k,bd]of Object.entries(d.boards)){if(st.boards[k]){if(!st.boards[k].nameEs)st.boards[k].nameEs=bd.nameEs;continue}
    st.boards[k]={name:bd.name,nameEs:bd.nameEs,items:bd.items.map(id=>{const nid=uid('d');st.buttons[nid]={...d.buttons[id]};return nid})}}
  /* fill Spanish for words that match the defaults */
  const esMap={};Object.values(d.buttons).forEach(b=>{const k=b.label.toLowerCase();if(!esMap[k])esMap[k]=b});
  Object.values(st.buttons).forEach(b=>{const m=esMap[(b.label||'').toLowerCase()];if(b.labelEs==null)b.labelEs=m?m.labelEs:'';if(b.sayEs==null)b.sayEs=m&&m.say===b.say?m.sayEs:''});
  const esSched={};d.schedule.forEach(s=>esSched[s.label]=s.labelEs);st.schedule.forEach(s=>{if(s.labelEs==null)s.labelEs=esSched[s.label]||''});
  st.v=2;return st}

/* ---------- boot ---------- */
applySettings();render();renderMsg();
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(UI.tab==='art')sizeArt();else if(['talk','feel','learn'].includes(UI.tab))render()},150)});
(async()=>{await DB.open();try{const saved=await DB.get('kv','state');if(saved)S=migrate(saved);else save()}catch(e){}
  await loadMedia();applySettings();render();renderMsg()})();
</script>
